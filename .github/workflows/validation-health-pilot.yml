name: Validation Health Pilot

# Manual-only pilot. The production daily cadence remains out of scope until
# P5's transition manifest v1 is reviewed and the full target set is explicit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-health-pilot
  cancel-in-progress: false

env:
  DASHBOARD_ISSUE: '892'
  SKIP_PROVISION: 'false'

jobs:
  validate-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout public main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Detect selected L4 declarations
        id: l4
        run: |
          set -euo pipefail
          has_l4="$(python .github/scripts/run-validation-health-pilot.py \
            --detect-l4-only \
            --repo-root "$GITHUB_WORKSPACE")"
          echo "has_l4=$has_l4" >> "$GITHUB_OUTPUT"
          echo "Selected sample declares L4: $has_l4"

      - name: Refuse undeclared credential boundary
        if: steps.l4.outputs.has_l4 == 'true'
        run: |
          echo "::error::A selected sample now declares L4, but this pilot intentionally has no credentialed L4 boundary."
          echo "::error::Add a reviewed main-only credential boundary before running declared L4."
          exit 1

      - name: Read current dashboard state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue view "$DASHBOARD_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > "$RUNNER_TEMP/previous-dashboard.md"

      - name: Validate pilot samples
        id: validate
        env:
          EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          source_sha="$(git rev-parse HEAD)"
          python .github/scripts/run-validation-health-pilot.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --previous-body "$RUNNER_TEMP/previous-dashboard.md" \
            --source-sha "$source_sha" \
            --evidence-url "$EVIDENCE_URL" \
            --output "$RUNNER_TEMP/validation-health-results.json"
          validation_rc=$?
          echo "validation_rc=$validation_rc" >> "$GITHUB_OUTPUT"
          echo "Pilot validation exit code: $validation_rc"
          exit 0

      - name: Render dashboard
        run: |
          set -euo pipefail
          python .github/scripts/render-validation-health.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --results "$RUNNER_TEMP/validation-health-results.json" \
            --output "$RUNNER_TEMP/validation-health.md"

      - name: Update pinned dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue edit "$DASHBOARD_ISSUE" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/validation-health.md"

      - name: Upload pilot result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-health-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/validation-health-results.json
            ${{ runner.temp }}/validation-health.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce pilot validation verdict
        if: always()
        env:
          VALIDATION_RC: ${{ steps.validate.outputs.validation_rc }}
        run: |
          set -euo pipefail
          if [[ ! "$VALIDATION_RC" =~ ^[0-9]+$ ]]; then
            echo "::error::Pilot validation did not produce a result exit code."
            exit 1
          fi
          exit "$VALIDATION_RC"
