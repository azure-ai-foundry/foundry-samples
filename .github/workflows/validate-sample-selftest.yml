name: validate-sample self-test

# INERT DEV HARNESS — proves .github/scripts/validate-sample.sh is callable from a
# real GitHub Actions runner and that the classifier's pass(0)/fail(1)/error(2) split
# holds for all 5 languages on the toolchains ubuntu-latest provides.
#
# It is deliberately scoped so it NEVER fires on real public-repo traffic:
#   - workflow_dispatch: an inert stub for the FINAL intended manual trigger. (Dispatch
#     via API/CLI only works once the workflow lives on the default branch, which we are
#     NOT touching yet — so during dev this stub does nothing on its own.)
#   - pull_request scoped to base == the integration branch below. Real public PRs
#     target `main`, so they can never match. Only a throwaway internal PR whose BASE is
#     the integration branch will run this.
#
# Credential-free by construction: permissions is contents:read only. No secrets, no
# OIDC, no privileged runners. Do NOT add broad push/pull_request/schedule triggers here
# — trigger activation on main is a separate, final, reviewed change.
on:
  workflow_dispatch:
  pull_request:
    branches: [ brandom-msft-brandom-public-validation-pipeline ]
    paths:
      - '.github/scripts/validate-sample.sh'
      - '.github/scripts/test/**'
      - '.github/workflows/validate-sample-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Toolchain versions
        run: |
          dotnet --version
          python --version
          node --version
          npm --version
          java -version
          go version

      - name: Phase-1 exit gate — all 5 languages, pass(0)/fail(1)/error(2)
        run: bash .github/scripts/test/run-tests.sh
