name: browser-automation-agent-sample-foundry
description: >
  A Foundry-hosted browser automation agent sample with selectable profiles for
  general browsing, web scraping, form filling, and QA testing.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - Browser Automation
template:
  name: browser-automation-agent-sample-foundry
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: BROWSER_AGENT_TOOLBOX_NAME
      value: "{{BROWSER_AGENT_TOOLBOX_NAME}}"
    - name: BROWSER_AGENT_PROFILE
      value: "{{BROWSER_AGENT_PROFILE}}"
    - name: BROWSER_AGENT_PROMPT_FILE
      value: "{{BROWSER_AGENT_PROMPT_FILE}}"
    - name: BROWSER_AGENT_PLAYWRIGHT_CLI_TIMEOUT_SECONDS
      value: "{{BROWSER_AGENT_PLAYWRIGHT_CLI_TIMEOUT_SECONDS}}"
    - name: BROWSER_AGENT_MCP_TIMEOUT_SECONDS
      value: "{{BROWSER_AGENT_MCP_TIMEOUT_SECONDS}}"
resources:
  - kind: model
    id: gpt-4o-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME

