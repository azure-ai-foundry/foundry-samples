# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  extensions:
    azure.ai.agents: '>=1.0.0-beta.4'
name: bat-python-byo
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  bat-python-byo:
    host: azure.ai.agent
    uses:
      - ai-project
    metadata:
      tags:
        - Agent Framework
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Browser Automation
    project: src/bat-python-byo
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    kind: hosted
    name: bat-python-byo
    description: A Foundry-hosted browser automation agent sample for general browsing, web scraping, and form filling.
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5.4-mini}
      - name: TOOLBOX_NAME
        value: browser-automation-tools
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
hooks:
  postprovision:
    windows:
      shell: pwsh
      run: hooks/postprovision.ps1
      interactive: true
    posix:
      shell: sh
      run: hooks/postprovision.sh
      interactive: true
  postdeploy:
    windows:
      shell: pwsh
      run: hooks/postdeploy.ps1
    posix:
      shell: sh
      run: hooks/postdeploy.sh
infra:
  provider: microsoft.foundry
